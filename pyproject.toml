[project]
name = "hashtree"
version = "0.2.0"
description = "CLI utility to compute hashes for an entire directory tree and all files within"
readme = "README.md"
requires-python = ">=3.12" # Path.walk was added in 3.12
dependencies = []

[dependency-groups]
dev = [
    "mypy>=1.19.0",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff.lint]
extend-select = ["E", "W"]

[tool.ruff.lint.pycodestyle]
max-line-length = 150
