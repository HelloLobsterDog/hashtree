[project]
name = "hashtree"
version = "0.0.5"
description = "A CLI utility to calculate hashes for everything in a directory tree and provide a single composite hash of everything, including subdirectories and their contents."
readme = "README.md"
requires-python = ">=3.11" # hashlib.file_digest & tomllib were introduced in version 3.11
dependencies = []

[project.scripts]
hashtree = "hashtree:run"

[dependency-groups]
dev = [
    "mypy>=1.19.0",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff.lint]
extend-select = ["E", "W"]

[tool.ruff.lint.pycodestyle]
max-line-length = 150
